<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalibrasi Suhu Yontech</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #121212; 
            color: #e0e0e0;
        }
        
        .card { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 350px;
            border: 1px solid #333;
        }

        h2 { 
            margin: 0 0 20px 0;
            color: #bb86fc; 
            font-size: 1.4rem; 
            text-align: center; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group { margin-bottom: 15px; }
        
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-size: 0.8rem; 
            color: #b0b0b0; 
        }

        input { 
            width: 100%; 
            padding: 12px; 
            background: #2c2c2c;
            border: 2px solid #3d3d3d; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 1.1rem; 
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus { border-color: #bb86fc; }

        .result-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .result-box { 
            padding: 15px; 
            border-radius: 8px; 
            text-align: center; 
            background-color: #252525;
            border: 1px dashed #444;
        }

        .highlight {
            border: 2px solid #03dac6;
            background-color: #1a2e2c;
        }

        .label-hasil { 
            font-size: 0.7rem; 
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            color: #bbb;
        }

        .nilai { font-weight: bold; font-size: 1.5rem; color: #ffffff; }
        .nilai-besar { font-size: 3rem; font-weight: bold; color: #03dac6; }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #666;
            margin-top: 25px;
            line-height: 1.5;
        }
        
        hr { border: 0; border-top: 1px solid #333; margin: 20px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>Kalibrasi Penetas</h2>
    
    <div class="input-group">
        <label>Suhu Standar (Acuan)</label>
        <input type="number" id="standar" placeholder="0" oninput="hitung()" step="any">
    </div>

    <div class="input-group">
        <label>Suhu Terbaca di Alat Sekarang</label>
        <input type="number" id="alat" placeholder="0" oninput="hitung()" step="any">
    </div>

    <div class="input-group">
        <label>Nilai Kalibrasi Saat Ini</label>
        <input type="number" id="offset_skrg" value="0" oninput="hitung()" step="any">
    </div>

    <hr>

    <div class="result-container">
        <div class="result-box">
            <div class="label-hasil">NILAI KOREKSI</div>
            <div id="koreksi_baru" class="nilai">0</div>
        </div>

        <div class="result-box highlight">
            <div class="label-hasil" style="color: #03dac6;">SETTING HARUS DIINPUT</div>
            <div id="total_offset" class="nilai-besar">0</div>
        </div>
    </div>
    
    <div class="footer-note">
        Hasil otomatis berubah saat mengetik<br>
        <b>© 2026 - Yontech</b>
    </div>
</div>

<script>
    function hitung() {
        const standar = parseFloat(document.getElementById('standar').value);
        const alat = parseFloat(document.getElementById('alat').value);
        const offsetSkrg = parseFloat(document.getElementById('offset_skrg').value) || 0;

        const koreksiBaruElement = document.getElementById('koreksi_baru');
        const totalOffsetElement = document.getElementById('total_offset');

        if (!isNaN(standar) && !isNaN(alat)) {
            // Hitung selisih murni
            const selisih = (standar - alat).toFixed(1);
            
            // Hitung akumulasi untuk settingan alat
            const totalOffset = (offsetSkrg + (standar - alat)).toFixed(1);

            // Tampilkan Koreksi (dengan tanda + jika positif)
            koreksiBaruElement.innerText = (selisih > 0 ? "+" : "") + selisih;
            
            // Tampilkan Settingan Akhir (dengan tanda + jika positif)
            totalOffsetElement.innerText = (totalOffset > 0 ? "+" : "") + totalOffset;
        } else {
            koreksiBaruElement.innerText = "0";
            totalOffsetElement.innerText = "0";
        }
    }
</script>

</body>
</html>
