<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalibrasi Suhu Yontech</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Font Digital Asli (Digital-7) -->
    <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">

    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #121212; 
            color: #e0e0e0;
        }
        
        .card { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 300px;
            border: 1px solid #333;
        }

        h2 { 
            margin: 0 0 20px 0;
            color: #bb86fc; 
            font-size: 1.1rem; 
            text-align: center; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* INPUT */
        .input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
        }
        
        label { 
            font-size: 0.82rem; 
            color: #b0b0b0; 
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label i {
            color: #03dac6;
            width: 16px;
            text-align: center;
        }

        input { 
            width: 85px;
            padding: 6px; 
            background: #2c2c2c;
            border: 1px solid #444; 
            border-radius: 4px; 
            font-size: 1rem; 
            color: #03dac6;
            outline: none;
            text-align: center;
        }

        input:focus { 
            border-color: #bb86fc; 
        }

        /* RESULT */
        .result-container {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .result-box { 
            padding: 10px; 
            border-radius: 8px; 
            text-align: center; 
            background-color: #252525;
            border: 1px solid #333;
        }

        /* DIGITAL SCREEN RED */
        .highlight {
            grid-column: span 2;
            border: 1px solid #ff0000;
            background-color: #000; 
            padding: 15px;
            border-radius: 10px;
            box-shadow: 
                inset 0 0 15px rgba(255, 0, 0, 0.3),
                0 0 12px rgba(255, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* Efek Scanline */
        .highlight::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 0, 0, 0) 50%, rgba(255, 0, 0, 0.05) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        .label-hasil { 
            font-size: 0.65rem; 
            color: #8a5c5c;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }


        .label-hasil { 
            font-size: 0.65rem; 
            color: #999;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nilai { 
            font-weight: bold; 
            font-size: 1.3rem; 
            color: #fff; 
        }

        /* FONT DIGITAL - RED GLOW */
        .nilai-besar { 
            font-size: 3rem; 
            font-weight: normal; 
            color: #ff0000; 
            line-height: 1;
            font-family: 'Digital-7 Mono', sans-serif;
            letter-spacing: 2px;
            text-shadow:
                0 0 5px rgba(255, 0, 0, 0.8),
                0 0 15px rgba(255, 0, 0, 0.4);
        }

        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #444;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Kalibrasi Penetas</h2>
    
    <div class="input-row">
        <label>
            <i class="fa-solid fa-temperature-half"></i>
            Suhu Standar (Acuan)
        </label>
        <input type="number" id="standar" placeholder="0" oninput="hitung()" step="any">
    </div>

    <div class="input-row">
        <label>
            <i class="fa-solid fa-display"></i>
            Suhu Terbaca Alat
        </label>
        <input type="number" id="alat" placeholder="0" oninput="hitung()" step="any">
    </div>

    <div class="input-row">
        <label>
            <i class="fa-solid fa-microchip"></i>
            Offset Saat Ini
        </label>
        <input type="number" id="offset_skrg" value="0" oninput="hitung()" step="any">
    </div>

    <div class="result-container">

        <div class="result-box">
            <div class="label-hasil">Koreksi</div>
            <div id="koreksi_baru" class="nilai">0</div>
        </div>

        <div class="result-box">
            <div class="label-hasil">Status</div>
            <div id="status" class="nilai" style="font-size: 0.9rem; color: #bb86fc;">-</div>
        </div>

        <div class="result-box highlight">
            <div class="label-hasil" style="color: #ff0000;">
                Setting Kalibrasi Baru
            </div>

            <div id="total_offset" class="nilai-besar">
                0.0
            </div>
        </div>

    </div>
    
    <div class="footer">
        © 2026 - Yontech
    </div>
</div>

<script>
    function hitung() {
        const standar = parseFloat(document.getElementById('standar').value);
        const alat = parseFloat(document.getElementById('alat').value);
        const offsetSkrg = parseFloat(document.getElementById('offset_skrg').value) || 0;

        const koreksiEl = document.getElementById('koreksi_baru');
        const totalEl = document.getElementById('total_offset');
        const statusEl = document.getElementById('status');

        if (!isNaN(standar) && !isNaN(alat)) {
            const selisih = (standar - alat).toFixed(1);
            const total = (offsetSkrg + (standar - alat)).toFixed(1);

            koreksiEl.innerText = (selisih > 0 ? "+" : "") + selisih;
            totalEl.innerText = (total > 0 ? "+" : "") + total;

            if (selisih > 0) {
                statusEl.innerText = "Rendah";
            } 
            else if (selisih < 0) {
                statusEl.innerText = "Tinggi";
            } 
            else {
                statusEl.innerText = "Akurat";
            }
        } else {
            koreksiEl.innerText = "0";
            totalEl.innerText = "0.0";
            statusEl.innerText = "-";
        }
    }
</script>

</body>
</html>
