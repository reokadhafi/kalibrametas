<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalibrasi & Monitoring Yontech</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">

    <style>
        :root {
            --primary: #bb86fc;
            --secondary: #03dac6;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2c2c2c;
            --text: #e0e0e0;
            --danger: #ff0000;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 350px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        h2 { 
            margin: 0 0 15px 0;
            color: var(--primary); 
            font-size: 1rem; 
            text-align: center; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group { margin-bottom: 15px; }

        label { 
            font-size: 0.75rem; 
            color: #b0b0b0; 
            display: block;
            margin-bottom: 5px;
        }

        input { 
            width: 100%;
            padding: 10px; 
            background: var(--input-bg);
            border: 1px solid #444; 
            border-radius: 6px; 
            font-size: 0.9rem; 
            color: var(--secondary);
            outline: none;
            box-sizing: border-box;
        }

        input:disabled { opacity: 0.3; cursor: not-allowed; }

        /* TAB SYSTEM */
        .tab-container {
            display: flex;
            background: #121212;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: none;
            color: #888;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #000;
            font-weight: bold;
        }

        /* CALIBRATION RESULT */
        .highlight {
            background: #000;
            border: 1px solid var(--danger);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .nilai-besar { 
            font-family: 'Digital-7 Mono', sans-serif;
            font-size: 2.8rem;
            color: var(--danger);
            text-shadow: 0 0 10px rgba(255,0,0,0.5);
        }

        .result-display {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px dashed var(--secondary);
            margin-top: 10px;
        }

        .res-label { font-size: 0.7rem; color: #999; margin-bottom: 5px; text-transform: uppercase; }
        .res-main { font-size: 1.2rem; font-weight: bold; color: var(--secondary); }

        .footer { font-size: 0.7rem; color: #444; }
    </style>
</head>
<body>

    <!-- KALIBRASI -->
    <div class="card">
        <h2><i class="fa-solid fa-temperature-half"></i> Kalibrasi</h2>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <div style="flex: 1;">
                <label>
                    <i class="fa-solid fa-temperature-half"></i>
                    Suhu Acuan
                </label>
                <input type="number" id="standar" placeholder="38.0" oninput="hitungKalibrasi()">
            </div>
            <div style="flex: 1;">
                <label>
                    <i class="fa-solid fa-display"></i>
                    Suhu Alat
                </label>
                <input type="number" id="alat" placeholder="37.5" oninput="hitungKalibrasi()">
            </div>
        </div>
        <label>
            <i class="fa-solid fa-microchip"></i>
            Nilai Kalibrasi Saat Ini
        </label>
        <input type="number" id="offset_skrg" value="0" oninput="hitungKalibrasi()" style="margin-bottom: 15px;">

        <div class="highlight">
            <div style="font-size: 0.6rem; color: var(--danger); margin-bottom: 5px;">SETTING BARU</div>
            <div id="total_offset" class="nilai-besar">0.0</div>
        </div>
    </div>

    <!-- CEK WAKTU -->
    <div class="card">
        <h2><i class="fa-solid fa-clock"></i> Cek Waktu</h2>
        
        <div class="input-group">
            <label><i class="fa-solid fa-calendar-plus"></i> Tanggal Masuk</label>
            <input type="date" id="tgl_masuk" onchange="prosesWaktu()">
        </div>

        <div class="tab-container">
            <button class="tab-btn active" onclick="switchMode('hari')">CARI TANGGAL</button>
            <button class="tab-btn" onclick="switchMode('tgl')">CARI HARI</button>
        </div>

        <div id="mode_hari" class="input-group">
            <label>Masukkan Jumlah Hari</label>
            <input type="number" id="input_hari" placeholder="Contoh: 21" oninput="prosesWaktu()">
        </div>

        <div id="mode_tgl" class="input-group" style="display: none;">
            <label>Pilih Tanggal Tujuan</label>
            <input type="date" id="input_tgl" onchange="prosesWaktu()">
        </div>

        <div class="result-display">
            <div class="res-label" id="label_hasil">Hasil Perhitungan</div>
            <div class="res-main" id="output_hasil">-</div>
        </div>
    </div>

    <div class="footer">© 2026 - Yontech</div>

    <script>
        let modeAktif = 'hari';

        function switchMode(mode) {
            modeAktif = mode;
            const btnHari = document.querySelectorAll('.tab-btn')[0];
            const btnTgl = document.querySelectorAll('.tab-btn')[1];
            const divHari = document.getElementById('mode_hari');
            const divTgl = document.getElementById('mode_tgl');

            if(mode === 'hari') {
                btnHari.classList.add('active');
                btnTgl.classList.remove('active');
                divHari.style.display = 'block';
                divTgl.style.display = 'none';
                document.getElementById('input_tgl').value = '';
            } else {
                btnTgl.classList.add('active');
                btnHari.classList.remove('active');
                divTgl.style.display = 'block';
                divHari.style.display = 'none';
                document.getElementById('input_hari').value = '';
            }
            prosesWaktu();
        }

        function hitungKalibrasi() {
            const s = parseFloat(document.getElementById('standar').value);
            const a = parseFloat(document.getElementById('alat').value);
            const o = parseFloat(document.getElementById('offset_skrg').value) || 0;
            if(!isNaN(s) && !isNaN(a)) {
                const total = (o + (s - a)).toFixed(1);
                document.getElementById('total_offset').innerText = (total > 0 ? "+" : "") + total;
            }
        }

        function prosesWaktu() {
            const tglMasukVal = document.getElementById('tgl_masuk').value;
            const output = document.getElementById('output_hasil');
            const label = document.getElementById('label_hasil');

            if (!tglMasukVal) {
                output.innerText = "Set Tanggal Masuk";
                return;
            }

            const tglMasuk = new Date(tglMasukVal);
            const opsi = { day: 'numeric', month: 'long', year: 'numeric' };

            if (modeAktif === 'hari') {
                const jmlHari = document.getElementById('input_hari').value;
                label.innerText = "Jatuh Pada Tanggal";
                if (jmlHari) {
                    let target = new Date(tglMasuk);
                    target.setDate(target.getDate() + parseInt(jmlHari));
                    output.innerText = target.toLocaleDateString('id-ID', opsi);
                } else {
                    output.innerText = "-";
                }
            } else {
                const tglTujuanVal = document.getElementById('input_tgl').value;
                label.innerText = "Lama Waktu (Hari)";
                if (tglTujuanVal) {
                    const tglTujuan = new Date(tglTujuanVal);
                    const selisih = Math.ceil((tglTujuan - tglMasuk) / (1000 * 60 * 60 * 24));
                    output.innerText = selisih >= 0 ? selisih + " Hari" : "Tanggal Lampau";
                } else {
                    output.innerText = "-";
                }
            }
        }
    </script>
</body>
</html>
