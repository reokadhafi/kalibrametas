<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalibrasi Suhu Yontech</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Font Digital Asli (Digital-7) -->
    <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">

    <style>
        /* ANIMASI BACKGROUND */
        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: 40px 40px; }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #0d0d0d;
            /* Layer 1: Gradient statis */
            background-image: 
                radial-gradient(circle at center, #1a1a2e 0%, #0d0d0d 100%),
                /* Layer 2: Grid bergerak */
                linear-gradient(rgba(187, 134, 252, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(187, 134, 252, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            animation: moveGrid 3s linear infinite;
            color: #e0e0e0;
            overflow: hidden;
        }

        .card { 
            background: rgba(30, 30, 30, 0.95); 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
            width: 100%; 
            max-width: 320px;
            border: 1px solid #333;
            backdrop-filter: blur(10px); /* Efek kaca transparan */
            position: relative;
            z-index: 10;
        }

        h2 { 
            margin: 0 0 25px 0;
            color: #bb86fc; 
            font-size: 1.2rem; 
            text-align: center; 
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        /* INPUT */
        .input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }
        
        label { 
            font-size: 0.85rem; 
            color: #b0b0b0; 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label i {
            color: #03dac6;
            width: 18px;
            text-align: center;
        }

        input { 
            width: 90px;
            padding: 8px; 
            background: #2c2c2c;
            border: 1px solid #444; 
            border-radius: 6px; 
            font-size: 1rem; 
            color: #03dac6;
            outline: none;
            text-align: center;
            transition: all 0.3s;
        }

        input:focus { 
            border-color: #bb86fc; 
            box-shadow: 0 0 8px rgba(187, 134, 252, 0.3);
        }

        /* RESULT SECTION */
        .result-container {
            margin-top: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .result-box { 
            padding: 12px; 
            border-radius: 10px; 
            text-align: center; 
            background-color: #252525;
            border: 1px solid #333;
        }

        /* DIGITAL SCREEN RED */
        .highlight {
            grid-column: span 2;
            border: 1px solid #ff0000;
            background-color: #000; 
            padding: 20px;
            border-radius: 12px;
            box-shadow: 
                inset 0 0 15px rgba(255, 0, 0, 0.2),
                0 0 20px rgba(255, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .highlight::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 0, 0, 0) 50%, rgba(255, 0, 0, 0.03) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        .label-hasil { 
            font-size: 0.7rem; 
            color: #999;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nilai { 
            font-weight: bold; 
            font-size: 1.4rem; 
            color: #fff; 
        }

        /* FONT DIGITAL - RED GLOW */
        .nilai-besar { 
            font-size: 3.5rem; 
            font-weight: normal; 
            color: #ff0000; 
            line-height: 1;
            font-family: 'Digital-7 Mono', sans-serif;
            letter-spacing: 3px;
            text-shadow:
                0 0 5px rgba(255, 0, 0, 0.8),
                0 0 20px rgba(255, 0, 0, 0.4);
            animation: pulse 2s infinite ease-in-out;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #666;
            margin-top: 25px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Kalibrasi Penetas</h2>
    
    <div class="input-row">
        <label>
            <i class="fa-solid fa-temperature-half"></i>
            Suhu Standar
        </label>
        <input type="number" id="standar" placeholder="0" oninput="hitung()" step="any">
    </div>

    <div class="input-row">
        <label>
            <i class="fa-solid fa-display"></i>
            Suhu Alat
        </label>
        <input type="number" id="alat" placeholder="0" oninput="hitung()" step="any">
    </div>

    <div class="input-row">
        <label>
            <i class="fa-solid fa-microchip"></i>
            Offset Sekarang
        </label>
        <input type="number" id="offset_skrg" value="0" oninput="hitung()" step="any">
    </div>

    <div class="result-container">
        <div class="result-box">
            <div class="label-hasil">Koreksi</div>
            <div id="koreksi_baru" class="nilai">0</div>
        </div>

        <div class="result-box">
            <div class="label-hasil">Status</div>
            <div id="status" class="nilai" style="font-size: 0.9rem; color: #bb86fc;">-</div>
        </div>

        <div class="result-box highlight">
            <div class="label-hasil" style="color: #ff3333; font-weight: bold;">
                Setting Kalibrasi Baru
            </div>

            <div id="total_offset" class="nilai-besar">
                0.0
            </div>
        </div>
    </div>
    
    <div class="footer">
        <b>YONTECH</b> - Precision System © 2026
    </div>
</div>

<script>
    function hitung() {
        const standar = parseFloat(document.getElementById('standar').value);
        const alat = parseFloat(document.getElementById('alat').value);
        const offsetSkrg = parseFloat(document.getElementById('offset_skrg').value) || 0;

        const koreksiEl = document.getElementById('koreksi_baru');
        const totalEl = document.getElementById('total_offset');
        const statusEl = document.getElementById('status');

        if (!isNaN(standar) && !isNaN(alat)) {
            const selisih = (standar - alat).toFixed(1);
            const total = (offsetSkrg + (standar - alat)).toFixed(1);

            koreksiEl.innerText = (selisih > 0 ? "+" : "") + selisih;
            totalEl.innerText = (total > 0 ? "+" : "") + total;

            if (selisih > 0) {
                statusEl.innerText = "RENDAH";
                statusEl.style.color = "#ff9800";
            } 
            else if (selisih < 0) {
                statusEl.innerText = "TINGGI";
                statusEl.style.color = "#f44336";
            } 
            else {
                statusEl.innerText = "AKURAT";
                statusEl.style.color = "#03dac6";
            }
        } else {
            koreksiEl.innerText = "0";
            totalEl.innerText = "0.0";
            statusEl.innerText = "-";
            statusEl.style.color = "#bb86fc";
        }
    }
</script>

</body>
</html>
