<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalibrasi Penetas</title>
    <style>
        /* Tema Gelap */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #121212; 
            color: #e0e0e0;
        }
        
        .card { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 320px;
            border: 1px solid #333;
        }

        h2 { 
            margin-top: 0;
            color: #bb86fc; 
            font-size: 1.4rem; 
            text-align: center; 
            letter-spacing: 1px;
        }

        .input-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 0.85rem; 
            color: #b0b0b0; 
        }

        input { 
            width: 100%; 
            padding: 12px; 
            background: #2c2c2c;
            border: 2px solid #3d3d3d; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 1.1rem; 
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus { border-color: #bb86fc; }

        .result-box { 
            margin-top: 10px; 
            padding: 20px; 
            border-radius: 8px; 
            text-align: center; 
            transition: all 0.3s ease;
        }

        .label-hasil { 
            font-size: 0.75rem; 
            letter-spacing: 2px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .nilai-koreksi { 
            font-size: 3rem; 
            font-weight: bold; 
        }

        /* Warna Status */
        .positif { background-color: #1b5e20; color: #a5d6a7; }
        .negatif { background-color: #b71c1c; color: #ef9a9a; }
        .netral { background-color: #333; color: #9e9e9e; }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Kalibrasi Suhu Metas</h2>
    
    <div class="input-group">
        <label>Suhu Standar (Acuan)</label>
        <input type="number" id="standar" placeholder="0" oninput="hitung()" step="any">
    </div>

    <div class="input-group">
        <label>Suhu Perangkat Yang Akan Dikalibrasi</label>
        <input type="number" id="alat" placeholder="0" oninput="hitung()" step="any">
    </div>

    <div id="display" class="result-box netral">
        <div class="label-hasil">KOREKSI</div>
        <div id="hasil" class="nilai-koreksi">0</div>
    </div>
    
    <div class="footer-note">
        Hasil otomatis berubah saat mengetik
        <p>2026 - Yontech</p>
    </div>
</div>

<script>
    function hitung() {
        const standar = parseFloat(document.getElementById('standar').value);
        const alat = parseFloat(document.getElementById('alat').value);
        const display = document.getElementById('display');
        const hasilElement = document.getElementById('hasil');

        if (!isNaN(standar) && !isNaN(alat)) {
            // Rumus: Koreksi = Standar - Alat
            const koreksi = (standar - alat).toFixed(1);
            
            // Tambahkan tanda + jika angka di atas nol
            const hasilTeks = koreksi > 0 ? "+" + koreksi : koreksi;
            hasilElement.innerText = hasilTeks;

            // Logika Warna
            if (koreksi > 0) {
                display.className = "result-box positif";
            } else if (koreksi < 0) {
                display.className = "result-box negatif";
            } else {
                display.className = "result-box netral";
            }
        } else {
            hasilElement.innerText = "0";
            display.className = "result-box netral";
        }
    }
</script>

</body>
</html>
