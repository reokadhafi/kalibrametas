<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalibrasi Suhu Yontech</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #121212; 
            color: #e0e0e0;
        }
        
        .card { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 280px;
            border: 1px solid #333;
        }

        h2 { 
            margin: 0 0 20px 0;
            color: #bb86fc; 
            font-size: 1.1rem; 
            text-align: center; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Baris Input */
        .input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        label { 
            font-size: 0.85rem; 
            color: #b0b0b0; 
        }

        input { 
            width: 80px; /* Ukuran input kecil */
            padding: 6px; 
            background: #2c2c2c;
            border: 1px solid #444; 
            border-radius: 4px; 
            font-size: 1rem; 
            color: #03dac6;
            outline: none;
            text-align: center;
        }

        input:focus { border-color: #bb86fc; }

        /* Area Hasil */
        .result-container {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .result-box { 
            padding: 10px; 
            border-radius: 8px; 
            text-align: center; 
            background-color: #252525;
            border: 1px solid #333;
        }

        .highlight {
            grid-column: span 2;
            border: 1px solid #03dac6;
            background-color: #1a2e2c;
            padding: 15px;
        }

        .label-hasil { 
            font-size: 0.65rem; 
            color: #999;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .nilai { font-weight: bold; font-size: 1.3rem; color: #fff; }
        .nilai-besar { font-size: 2.8rem; font-weight: bold; color: #03dac6; line-height: 1; }

        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #444;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Kalibrasi Penetas</h2>
    
    <div class="input-row">
        <label>Suhu Standar (Acuan)</label>
        <input type="number" id="standar" placeholder="0" oninput="hitung()" step="any">
    </div>

    <div class="input-row">
        <label>Suhu Terbaca Alat</label>
        <input type="number" id="alat" placeholder="0" oninput="hitung()" step="any">
    </div>

    <div class="input-row">
        <label>Nilai Kalibrasi Saat Ini</label>
        <input type="number" id="offset_skrg" value="0" oninput="hitung()" step="any">
    </div>

    <div class="result-container">
        <div class="result-box">
            <div class="label-hasil">Koreksi</div>
            <div id="koreksi_baru" class="nilai">0</div>
        </div>

        <div class="result-box">
            <div class="label-hasil">Status</div>
            <div id="status" class="nilai" style="font-size: 0.9rem; color: #bb86fc;">-</div>
        </div>

        <div class="result-box highlight">
            <div class="label-hasil" style="color: #03dac6;">Setting Kalibrasi Baru</div>
            <div id="total_offset" class="nilai-besar">0</div>
        </div>
    </div>
    
    <div class="footer">
        © 2026 - Yontech
    </div>
</div>

<script>
    function hitung() {
        const standar = parseFloat(document.getElementById('standar').value);
        const alat = parseFloat(document.getElementById('alat').value);
        const offsetSkrg = parseFloat(document.getElementById('offset_skrg').value) || 0;

        const koreksiEl = document.getElementById('koreksi_baru');
        const totalEl = document.getElementById('total_offset');
        const statusEl = document.getElementById('status');

        if (!isNaN(standar) && !isNaN(alat)) {
            const selisih = (standar - alat).toFixed(1);
            const total = (offsetSkrg + (standar - alat)).toFixed(1);

            koreksiEl.innerText = (selisih > 0 ? "+" : "") + selisih;
            totalEl.innerText = (total > 0 ? "+" : "") + total;
            
            if(selisih > 0) statusEl.innerText = "Alat Rendah";
            else if(selisih < 0) statusEl.innerText = "Alat Tinggi";
            else statusEl.innerText = "Akurat";
        } else {
            koreksiEl.innerText = "0";
            totalEl.innerText = "0";
            statusEl.innerText = "-";
        }
    }
</script>

</body>
</html>
