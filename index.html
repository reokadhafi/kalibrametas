<!DOCTYPE html>
    <button onclick="hitungKalibrasi()">
      Hitung Kalibrasi
    </button>

    <div class="result" id="hasil"></div>

    <div class="footer">
      GitHub Pages • Thermometer Calibration System
    </div>
  </div>

  <script>
    function hitungKalibrasi() {
      const kayu = parseFloat(document.getElementById('kayu').value);
      const digital = parseFloat(document.getElementById('digital').value);
      const hasil = document.getElementById('hasil');

      if (isNaN(kayu) || isNaN(digital)) {
        hasil.style.display = 'block';
        hasil.innerHTML = `
          <div class="status warning">
            Mohon isi semua data suhu.
          </div>
        `;
        return;
      }

      const selisih = digital - kayu;
      const koreksi = kayu - digital;

      let statusClass = 'good';
      let statusText = 'Thermometer digital masih akurat ✅';

      if (Math.abs(selisih) > 0.5) {
        statusClass = 'warning';
        statusText = 'Thermometer digital perlu dikalibrasi ⚠️';
      }

      hasil.style.display = 'block';

      hasil.innerHTML = `
        <h2>Hasil Kalibrasi</h2>

        <p>🌡️ <strong>Suhu Patokan:</strong> ${kayu.toFixed(1)} °C</p>
        <p>📟 <strong>Suhu Digital:</strong> ${digital.toFixed(1)} °C</p>
        <p>📏 <strong>Selisih:</strong> ${selisih.toFixed(1)} °C</p>
        <p>🛠️ <strong>Nilai Koreksi:</strong> ${koreksi.toFixed(1)} °C</p>

        <div class="status ${statusClass}">
          ${statusText}
        </div>
      `;
    }
  </script>

</body>
</html>
